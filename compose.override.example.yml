# Copy to compose.override.yml and uncomment what you need. Compose merges it automatically.

services:
  # --- Use an Ollama already running on the host (e.g. the M6's existing install) ---
  # Keeps the worker on the egress-denied network: the proxy is the only thing that can see the host.
  # Also set in .env:  OLLAMA_URL=http://ollama-proxy:11434
  # ollama-proxy:
  #   image: alpine/socat:latest
  #   restart: unless-stopped
  #   command: ["TCP-LISTEN:11434,fork,reuseaddr", "TCP:host.docker.internal:11434"]
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   networks: [backend, egress]
  # ollama:
  #   deploy:
  #     replicas: 0
  # ollama-init:
  #   deploy:
  #     replicas: 0

  # --- Tailscale TLS mode: mount the tailscaled socket so Caddy can fetch a tailnet cert ---
  # Also set in .env:  TLS_MODE=tailscale  DOMAIN=<machine>.<tailnet>.ts.net
  # caddy:
  #   volumes:
  #     - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock

