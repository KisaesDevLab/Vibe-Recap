  #   restart: unless-stopped
  #   environment:
  #     PUID: "1000"
  #     PGID: "1000"
  #     TZ: America/Chicago
  #   volumes:
  #     - duplicati_config:/config
  #     - ${RECAP_DATA:-./data}:/source/recap-data:ro
  #   ports:
  #     - "127.0.0.1:8200:8200"
  #   networks: [egress]

