# Throwaway Postgres + Redis for `npm test` and `pytest` integration tests.
#   npm run test:services      # start
#   npm run test:services:down # stop and wipe
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recap
      POSTGRES_PASSWORD: recap
      POSTGRES_DB: recap_test
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recap -d recap_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
