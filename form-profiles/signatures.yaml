# Software detection signatures. Matched case-insensitively against the text of the whole
# package (client copies bury the vendor marks in footers and report titles). First match wins;
# order is most-specific first. Form and year come from the IRS form page, not from cover letters.
software:
  ultratax:
    - "UltraTax CS"
    - "UltraTax"
    # UltraTax client copies never print the product name; these are its report titles.
    - "Federal Return Summary"
    - "Two Year Comparison Report"
    - "Tax Return History Report"
  lacerte:
    - "Lacerte"
  cch:
    - "CCH Axcess"
    - "ProSystem fx"
  gosystem:
    - "GoSystem"
  drake:
    - "Drake Software"
    - "Drake Tax"
  proseries:
    - "ProSeries"
form:
  "1040":
    - "Form 1040"
    - "U.S. Individual Income Tax Return"
  "1040-SR":
    - "Form 1040-SR"
  "1120-S":
    - "Form 1120-S"
  "1065":
    - "Form 1065"
  "1041":
    - "Form 1041"
