[project]
name = "vibe-recap-worker"
version = "0.2.0"
description = "Vibe Recap extraction and render pipeline"
requires-python = ">=3.12"
license = { text = "PolyForm-Small-Business-1.0.0" }
dependencies = [
  "bullmq>=2.5",
  "redis>=5",
  "psycopg[binary]>=3.2",
  "pyrage>=1.2",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "PyYAML>=6",
  "Jinja2>=3.1",
  "httpx>=0.27",
  "numpy>=1.26",
  "pypdf>=4",
  "Pillow>=10",
]

[project.optional-dependencies]
render = [
  "kokoro-onnx>=0.4",
  "soundfile>=0.12",
  "playwright>=1.47",
]
fixtures = ["reportlab>=4"]
dev = ["pytest>=8", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["recap*"]
